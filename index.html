<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hypatia Academy — Learn How Computers Really Work</title>
  <meta name="description" content="Free 9-month C and Arduino course for teenagers living in Europe. Live online classes taught by Walker Rowe.">
  <link rel="icon" href="img/hypatia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header">
    <nav class="nav container">
      <a class="brand" href="#top">
        <img src="img/hypatia.png" alt="" class="brand-icon">
        <span id="nav-brand"></span>
      </a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-collapse" id="nav-collapse">
        <ul id="nav-links" class="nav-links"></ul>
        <a id="nav-cta" class="btn btn-primary btn-sm" target="_blank" rel="noopener"></a>
      </div>
    </nav>
  </header>

  <main id="top">

    <section id="hero">
      <div class="hero-media">
        <img src="img/hypatia_banner.png" alt="Hypatia Academy students learning electronics and C programming">
      </div>
      <div class="hero-overlay"></div>
      <div class="hero-content container">
        <p id="hero-eyebrow" class="eyebrow reveal"></p>
        <h1 id="hero-title" class="reveal"></h1>
        <div class="hero-actions reveal">
          <a id="hero-cta-primary" class="btn btn-primary btn-lg" target="_blank" rel="noopener"></a>
          <a id="hero-cta-secondary" class="btn btn-ghost btn-lg" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </section>

    <section id="intro" class="section">
      <div class="container intro-wrap">
        <div id="intro-paragraphs" class="intro-text reveal"></div>
        <p id="intro-tagline" class="tagline reveal"></p>
      </div>
    </section>

    <section id="course" class="section alt">
      <div class="container split">
        <div class="split-text reveal">
          <h2 id="arduino-title" class="section-title"></h2>
          <div id="arduino-intro" class="body-text"></div>
          <ul id="arduino-fundamentals" class="chip-list"></ul>
          <div id="arduino-closing" class="body-text"></div>
        </div>
        <div class="split-media reveal">
          <img src="img/teenager.png" alt="Teenager learning electronics and programming">
        </div>
      </div>
    </section>

    <section id="learn" class="section">
      <div class="container">
        <h2 id="learn-title" class="section-title center reveal"></h2>
        <div id="learn-cards" class="card-grid"></div>
      </div>
    </section>

    <section id="different" class="section alt">
      <div class="container split reverse">
        <div class="split-text reveal">
          <h2 id="different-title" class="section-title"></h2>
          <div id="different-intro" class="body-text"></div>
          <ul id="different-questions" class="question-list"></ul>
          <p id="different-closing" class="body-text"></p>
        </div>
        <div class="split-media reveal">
          <img src="img/girlcoder.png" alt="Student writing code">
        </div>
      </div>
    </section>

    <section id="info" class="section">
      <div class="container info-grid">
        <div class="info-card reveal">
          <h3 id="who-title"></h3>
          <div id="who-body" class="body-text"></div>
        </div>
        <div class="info-card reveal">
          <h3 id="free-title"></h3>
          <div id="free-body" class="body-text"></div>
        </div>
      </div>
    </section>

    <section id="about" class="section alt">
      <div class="container">
        <h2 id="about-title" class="section-title center reveal"></h2>
        <div id="about-body" class="body-text about-text reveal"></div>
        <div class="instructor-card reveal">
          <img id="instructor-photo" src="" alt="">
          <div>
            <h3 id="instructor-name"></h3>
            <p id="instructor-bio"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="path" class="section">
      <div class="container">
        <h2 id="path-title" class="section-title center reveal"></h2>
        <p id="path-intro" class="body-text center reveal"></p>
        <ul id="path-steps" class="step-list reveal"></ul>
        <p id="path-closing" class="body-text center reveal"></p>
        <div id="path-flow" class="flow reveal"></div>
      </div>
    </section>

    <section id="apply" class="section cta-section">
      <div class="container apply-grid">
        <div class="apply-media reveal">
          <img src="img/girlcomputer.png" alt="Student learning at a computer">
        </div>
        <div class="apply-content reveal">
          <h2 id="apply-title" class="section-title"></h2>
          <p id="apply-intro" class="body-text"></p>
          <dl id="apply-details" class="details-grid"></dl>
          <a id="apply-cta" class="btn btn-primary btn-lg" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </section>

  </main>

  <footer id="site-footer">
    <div class="container footer-grid">
      <div>
        <div class="brand" id="footer-brand"></div>
        <p id="footer-tagline" class="footer-tagline"></p>
      </div>
      <ul class="footer-contact" id="footer-contact"></ul>
    </div>
    <div class="container footer-bottom">
      <p id="footer-copyright"></p>
      <a id="footer-privacy" href="privacy.html"></a>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
